services:
  postgres:
    image: postgres:17
    container_name: qm-pilot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: qmpilot
      POSTGRES_PASSWORD: qmpilot
      POSTGRES_DB: qmpilot
    volumes:
      - qm_pilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qmpilot -d qmpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  qm_pilot_pgdata:
