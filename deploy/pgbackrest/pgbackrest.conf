[global]
repo1-type=sftp
repo1-host=${PGBACKREST_REPO_HOST}
repo1-host-user=${PGBACKREST_REPO_USER}
repo1-host-port=${PGBACKREST_REPO_PORT:-23}
repo1-path=/backup/qmpilot
repo1-sftp-host-key-check-type=accept-new

repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=${PGBACKREST_CIPHER_PASS}

# Retention: 30 daily + weekly fulls for 3 months (R7)
# Strategy: nightly full (Mon–Sat) counts toward daily retention;
# Sunday full tagged as weekly anchor — pgBackRest retention-full=30
# plus repo1-retention-diff for incremental chain between fulls.
repo1-retention-full=30
repo1-retention-diff=6

process-max=2
log-level-console=info
log-path=/var/log/pgbackrest
spool-path=/var/spool/pgbackrest

[qmpilot]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-host=postgres
pg1-user=${POSTGRES_SUPERUSER:-postgres}
pg1-database=${POSTGRES_DB:-qmpilot}
